name: App Build
on:
  push:
    branches: [main]
    paths: ['app/**']
  pull_request:
    paths: ['app/**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run app:lint
      - run: npm run app:typecheck

