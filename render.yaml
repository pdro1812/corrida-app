services:
  - type: web
    name: corrida-app-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      - key: GARMIN_SYNC_CRON
        value: "0 7 * * *"
    healthCheckPath: /health
