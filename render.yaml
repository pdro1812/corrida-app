services:
  - type: web
    name: corrida-app-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=backend
    startCommand: cd backend && npx prisma migrate deploy && node dist/main
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      - key: GARMIN_SYNC_CRON
        value: "0 7 * * *"
    healthCheckPath: /health
